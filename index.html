:root {
  --bg: #FFFDF2;
  --ink: #1B2A41;
  --ink-soft: #55627A;
  --honey: #F5B800;
  --honey-soft: #FFE9A0;
  --honey-ink: #8A5E00;
  --board: #20292F;
  --board-ink: #FFFFFF;
  --card: rgba(255,255,255,.88);
  --line: #E8DDB0;
  --field: #FFFFFF;
  --win: #FFF1B8;
  --bg-op: .16;
  --gold: #F2B705;
  --silver: #B4BDC7;
  --bronze: #C27A3C;

}
@media (prefers-color-scheme: dark) {

    --bg: #14181C; --ink: #F4EFD8; --ink-soft: #AEB4BC; --honey: #F5B800; --honey-soft: #4A3C0A;

  }
}
:root[data-theme="dark"] {
  --bg: #14181C; --ink: #F4EFD8; --ink-soft: #AEB4BC; --honey: #F5B800; --honey-soft: #4A3C0A;

.app { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.board {
  background: var(--board); color: var(--board-ink); border: 5px solid var(--honey); border-radius: 22px;
  padding: 18px 20px 16px; text-align: center; display: flex; flex-direction: column; gap: 4px;
}
.board h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 7vw, 3.4rem);
  line-height: 1; letter-spacing: .02em; text-transform: uppercase; text-wrap: balance;
}
.board h1 span { color: var(--honey); }
.board p { margin: 0; color: #D9DEE4; font-weight: 700; font-size: .95rem; }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.tab {
  flex: 1 0 auto; min-width: 7.5rem; font: inherit; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem;
  padding: 10px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
}
.tab[aria-selected="true"] { background: var(--honey); border-color: var(--honey); color: #1B2A41; }
.tab:focus-visible, .btn:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--gold); box-shadow: inset 0 0 0 2px rgba(0,0,0,.18); }
.check { font-size: .8rem; }

.panel { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 16px; backdrop-filter: blur(3px); }
.panel-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.title-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 14rem; }
.title-field label, .lbl { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.title-input {
  font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; color: var(--ink); background: transparent;
  border: 0; border-bottom: 2px dashed var(--line); padding: 2px 0; width: 100%; min-width: 0;
}
.title-input:focus { border-bottom-color: var(--honey); }
.lede { margin: 0; color: var(--ink-soft); font-size: .95rem; max-width: 60ch; }

.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  font: inherit; font-weight: 800; font-size: .95rem; padding: 9px 16px; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--line); background: var(--field); color: var(--ink);
}
.btn:hover { border-color: var(--honey); }
.btn.primary { background: var(--honey); border-color: var(--honey); color: #1B2A41; font-size: 1.05rem; padding: 12px 22px; font-family: var(--font-display); font-weight: 600; }
.btn.primary:hover { filter: brightness(.95); }
.btn.dark { background: var(--board); border-color: var(--board); color: #fff; }

.tablewrap { overflow-x: auto; border-radius: 14px; border: 1.5px solid var(--line); background: var(--field); }
table { border-collapse: collapse; width: 100%; min-width: 30rem; }
th, td { padding: 8px 8px; text-align: center; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
thead th { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); background: var(--honey-soft); position: sticky; top: 0; }
td.num { width: 2.5rem; font-family: var(--font-display); font-weight: 600; color: var(--ink-soft); }
td.nm { text-align: left; min-width: 9rem; }
.cell {
  font: inherit; width: 100%; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--field); color: var(--ink);
  min-width: 0;
}
.cell.sc { width: 4.6rem; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
td.tot { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; font-variant-numeric: tabular-nums; min-width: 4.5rem; }
tr.win td { background: var(--win); }
.pill { display: inline-block; margin-left: 6px; font-size: .68rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--honey); color: #1B2A41; padding: 2px 8px; border-radius: 999px; vertical-align: middle; }

.note { margin: 0; font-weight: 700; color: var(--honey-ink); }
.winner {
  display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-radius: 16px;
  background: var(--board); color: #fff; border: 4px solid var(--honey);
}
.winner .k { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--honey); }
.winner .v { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 5vw, 2.2rem); line-height: 1.1; overflow-wrap: anywhere; }
.winner .s { color: #D9DEE4; font-weight: 700; }

/* Podio */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; padding: 6px 0 0; }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; text-align: center; }
.step .who { font-family: var(--font-display); font-weight: 700; font-size: clamp(1rem, 3.6vw, 1.5rem); line-height: 1.1; overflow-wrap: anywhere; }
.step .from { font-size: .8rem; font-weight: 700; color: var(--ink-soft); }
.step .pts { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.medal {
  width: 3.4rem; height: 3.4rem; border-radius: 50%; display: grid; place-items: center; color: var(--medal-ink);
  font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; border: 4px solid rgba(0,0,0,.18);
}
.block {
  width: 100%; border-radius: 14px 14px 0 0; display: grid; place-items: start center; padding-top: 10px;
  font-family: var(--font-display); font-weight: 700; color: var(--medal-ink); font-size: 1rem; letter-spacing: .04em; text-transform: uppercase;
}
.r1 .medal, .r1 .block { background: var(--gold); }
.r2 .medal, .r2 .block { background: var(--silver); }
.r3 .medal, .r3 .block { background: var(--bronze); }
.r1 .block { height: 150px; } .r2 .block { height: 110px; } .r3 .block { height: 80px; }
.r1 .who { font-size: clamp(1.15rem, 4.4vw, 1.9rem); }
.r1 .medal { width: 4.4rem; height: 4.4rem; font-size: 2.2rem; }
.empty-pod { margin: 0; text-align: center; color: var(--ink-soft); font-weight: 700; }

footer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; color: var(--ink-soft); font-size: .85rem; font-weight: 700; }
.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }

@media (max-width: 520px) {
  .panel { padding: 14px; }
  .title-input { font-size: 1.4rem; }
  .block { padding-top: 6px; font-size: .85rem; }
  .r1 .block { height: 120px; } .r2 .block { height: 88px; } .r3 .block { height: 62px; }
}
@media (prefers-reduced-motion: no-preference) {
  .winner, .podium { animation: rise .35s ease-out; }
  @keyframes rise { from { opacity: .0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
</style>

<div class="bgimg" aria-hidden="true"></div>
<div class="app">
  <header class="board">
    <h1>Spelling <span>Bee</span></h1>
    <p>Prof. Valeria Sposetti · Colegio San José</p>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Grados y Golden Bee"></nav>
  <main id="view"></main>
  <footer>
    <span>Los puntajes se guardan en este navegador.</span>
    <span id="reset-zone"></span>
  </footer>
</div>

<script>
(function () {
  var KEY = 'spellingbee-puntajes-v1';
  var GROUPS = 5;

  function newSet(name, groups, rounds) {
    var g = [];
    for (var i = 0; i < groups; i++) {
      var o = { name: '', scores: [] };
      for (var r = 0; r < rounds; r++) o.scores.push('');
      g.push(o);
    }
    return { name: name, groups: g, rounds: rounds, done: false, note: '' };
  }
  function fresh() {
    return { tab: 0, sets: [newSet('4.º grado', GROUPS, 5), newSet('5.º grado', GROUPS, 5), newSet('6.º grado', GROUPS, 5), newSet('Golden Bee', 3, 3)] };
  }
  var state = fresh();
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); if (p && p.sets && p.sets.length === 4) state = p; }
    var old = { 'Grado 1': '4.º grado', 'Grado 2': '5.º grado', 'Grado 3': '6.º grado' };
    state.sets.forEach(function (s) {
      if (old[s.name]) s.name = old[s.name];
      s.groups.forEach(function (g) { if (old[g.from]) g.from = old[g.from]; });
    });
  } catch (e) {}
  var confirmReset = false;

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function num(s) { var n = parseFloat(String(s).replace(',', '.')); return isNaN(n) ? 0 : n; }
  function fmt(n) { return n.toLocaleString('es-AR', { maximumFractionDigits: 2 }); }
  function total(g) { return g.scores.reduce(function (a, s) { return a + num(s); }, 0); }
  function gname(g, i) { return g.name.trim() || ('Grupo ' + (i + 1)); }

  // Ranking por competencia: 10, 10, 8 -> puestos 1, 1, 3
  function ranking(set) {
    var arr = set.groups.map(function (g, i) { return { i: i, t: total(g) }; });
    arr.sort(function (a, b) { return b.t - a.t || a.i - b.i; });
    var rank = 0;
    arr.forEach(function (x, k) { x.rank = (k > 0 && arr[k - 1].t === x.t) ? arr[k - 1].rank : k + 1; });
    return arr;
  }

  function renderTabs() {
    var html = '';
    state.sets.forEach(function (s, i) {
      var label = i === 3 ? '<span class="dot"></span>Golden Bee' : esc(s.name || ((i + 4) + '.º grado'));
      var ok = (i < 3 && s.done) ? '<span class="check">✓</span>' : '';
      html += '<button class="tab" role="tab" id="tab' + i + '" data-act="tab" data-i="' + i + '" aria-selected="' + (state.tab === i) + '">' + label + ok + '</button>';
    });
    document.getElementById('tabs').innerHTML = html;
  }

  function tableHtml(set, i) {
    var rk = set.done ? ranking(set) : null;
    var winners = {};
    if (rk) rk.forEach(function (x) { if (x.rank === 1 && x.t > 0) winners[x.i] = true; });
    var h = '<div class="tablewrap"><table><thead><tr><th>#</th><th style="text-align:left">Grupo</th>';
    for (var r = 0; r < set.rounds; r++) h += '<th>R' + (r + 1) + '</th>';
    h += '<th>Total</th></tr></thead><tbody>';
    set.groups.forEach(function (g, gi) {
      h += '<tr' + (winners[gi] ? ' class="win"' : '') + '><td class="num">' + (gi + 1) + '</td>';
      h += '<td class="nm"><input class="cell" type="text" data-k="name" data-i="' + i + '" data-g="' + gi + '" placeholder="Nombre del grupo" value="' + esc(g.name) + '" aria-label="Nombre del grupo ' + (gi + 1) + '">' + (winners[gi] ? '<span class="pill">Ganador</span>' : '') + '</td>';
      for (var r = 0; r < set.rounds; r++) {
        h += '<td><input class="cell sc" type="text" inputmode="decimal" data-k="score" data-i="' + i + '" data-g="' + gi + '" data-r="' + r + '" value="' + esc(g.scores[r]) + '" aria-label="Ronda ' + (r + 1) + ' de ' + esc(gname(g, gi)) + '"></td>';
      }
      h += '<td class="tot" id="t-' + i + '-' + gi + '">' + fmt(total(g)) + '</td></tr>';
    });
    return h + '</tbody></table></div>';
  }

  function gradeView(i) {
    var s = state.sets[i];
    var h = '<section class="panel">';
    h += '<div class="panel-head"><div class="title-field"><label for="gt">Grado</label><input id="gt" class="title-input" type="text" data-k="gname" data-i="' + i + '" value="' + esc(s.name) + '"></div>';
    h += '<div class="btns"><button class="btn" data-act="addround" data-i="' + i + '">+ Ronda</button><button class="btn" data-act="delround" data-i="' + i + '">− Ronda</button></div></div>';
    h += '<p class="lede">Escribí el nombre de cada grupo y el puntaje de cada ronda. El total se suma solo.</p>';
    h += tableHtml(s, i);
    if (s.note) h += '<p class="note">' + esc(s.note) + '</p>';
    if (s.done) {
      var rk = ranking(s), top = rk.filter(function (x) { return x.rank === 1; });
      var names = top.map(function (x) { return gname(s.groups[x.i], x.i); });
      h += '<div class="winner"><span class="k">' + (top.length > 1 ? 'Empate en el primer lugar · ' : 'Ganador de ') + esc(s.name) + '</span><span class="v">' + esc(names.join(' y ')) + '</span><span class="s">' + fmt(top[0].t) + ' puntos' + (top.length > 1 ? ' cada uno. En Golden Bee se cargó el primero; podés cambiarlo.' : '') + '</span></div>';
      h += '<div class="btns"><button class="btn" data-act="reopen" data-i="' + i + '">Reabrir grado</button><button class="btn dark" data-act="tab" data-i="3">Ir a Golden Bee →</button></div>';
    } else {
      h += '<div class="btns"><button class="btn primary" data-act="finish" data-i="' + i + '">Finalizar y ver ganador</button></div>';
    }
    return h + '</section>';
  }

  function goldenView() {
    var s = state.sets[3];
    var h = '<section class="panel">';
    h += '<div class="panel-head"><div class="title-field"><span class="lbl">Ronda final</span><span class="title-input" style="border:0">Golden Bee</span></div>';
    h += '<div class="btns"><button class="btn" data-act="addround" data-i="3">+ Ronda</button><button class="btn" data-act="delround" data-i="3">− Ronda</button></div></div>';
    h += '<p class="lede">Compiten los ganadores de cada grado. Al finalizar cada grado su ganador se carga acá. Podés corregir los nombres cuando quieras.</p>';
    h += '<div class="btns"><button class="btn" data-act="fetch">Traer ganadores de los grados</button></div>';
    var tbl = tableHtml(s, 3);
    s.groups.forEach(function (g, gi) { if (g.from) tbl = tbl.replace('placeholder="Nombre del grupo" value="' + esc(g.name) + '" aria-label="Nombre del grupo ' + (gi + 1) + '"', 'placeholder="Ganador de ' + esc(g.from) + '" value="' + esc(g.name) + '" aria-label="Nombre del grupo ' + (gi + 1) + '"'); });
    h += tbl;
    if (s.note) h += '<p class="note">' + esc(s.note) + '</p>';
    if (s.done) {
      var rk = ranking(s);
      var order = [1, 0, 2];
      h += '<div class="podium" aria-label="Podio">';
      order.forEach(function (pos) {
        var x = rk[pos]; if (!x) return;
        var g = s.groups[x.i], r = Math.min(x.rank, 3), lab = x.rank === 1 ? '1.er' : x.rank === 2 ? '2.º' : '3.er';
        h += '<div class="step r' + r + '"><div class="medal">' + x.rank + '</div><div class="who">' + esc(gname(g, x.i)) + '</div>' + (g.from ? '<div class="from">' + esc(g.from) + '</div>' : '') + '<div class="pts">' + fmt(x.t) + ' pts</div><div class="block">' + lab + ' lugar</div></div>';
      });
      h += '</div>';
      if (rk[0].rank === rk[1].rank || rk[1].rank === rk[2].rank) h += '<p class="note">Hay empate: los puestos se comparten. Podés sumar una ronda de desempate y volver a finalizar.</p>';
      h += '<div class="btns"><button class="btn" data-act="reopen" data-i="3">Reabrir Golden Bee</button></div>';
    } else {
      h += '<div class="btns"><button class="btn primary" data-act="finish" data-i="3">Finalizar y ver podio</button></div>';
    }
    return h + '</section>';
  }

  function render() {
    renderTabs();
    document.getElementById('view').innerHTML = state.tab === 3 ? goldenView() : gradeView(state.tab);
    var z = document.getElementById('reset-zone');
    z.innerHTML = confirmReset
      ? '<span class="confirm">¿Borrar todos los datos? <button class="btn dark" data-act="reset-yes">Sí, borrar</button><button class="btn" data-act="reset-no">Cancelar</button></span>'
      : '<button class="btn" data-act="reset">Reiniciar todo</button>';
  }

  function fillGolden() {
    var gold = state.sets[3];
    for (var i = 0; i < 3; i++) {
      var s = state.sets[i];
      if (!s.done) continue;
      var top = ranking(s)[0];
      var slot = gold.groups[i];
      slot.name = gname(s.groups[top.i], top.i);
      slot.from = s.name;
      slot.auto = true;
    }
  }

  document.addEventListener('input', function (e) {
    var t = e.target, k = t.getAttribute('data-k');
    if (!k) return;
    var i = +t.getAttribute('data-i'), s = state.sets[i];
    if (k === 'gname') {
      s.name = t.value;
      var tb = document.getElementById('tab' + i);
      if (tb) tb.innerHTML = esc(t.value || ((i + 4) + '.º grado')) + (s.done ? '<span class="check">✓</span>' : '');
    } else if (k === 'name') {
      var g = s.groups[+t.getAttribute('data-g')];
      g.name = t.value; g.auto = false;
    } else if (k === 'score') {
      var gi = +t.getAttribute('data-g');
      s.groups[gi].scores[+t.getAttribute('data-r')] = t.value;
      var cell = document.getElementById('t-' + i + '-' + gi);
      if (cell) cell.textContent = fmt(total(s.groups[gi]));
    }
    save();
  });

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act'), i = +b.getAttribute('data-i'), s = state.sets[i];
    if (act === 'tab') { state.tab = i; }
    else if (act === 'addround') { if (s.rounds < 12) { s.rounds++; s.groups.forEach(function (g) { g.scores.push(''); }); s.note = ''; s.done = false; } else s.note = 'El máximo es de 12 rondas.'; }
    else if (act === 'delround') {
      var last = s.rounds - 1, used = s.groups.some(function (g) { return String(g.scores[last]).trim() !== ''; });
      if (s.rounds <= 1) s.note = 'Tiene que haber al menos una ronda.';
      else if (used) s.note = 'La última ronda tiene puntajes. Borralos para poder quitarla.';
      else { s.rounds--; s.groups.forEach(function (g) { g.scores.pop(); }); s.note = ''; }
    }
    else if (act === 'finish') {
      var any = s.groups.some(function (g) { return total(g) > 0; });
      if (!any) { s.note = 'Cargá al menos un puntaje antes de finalizar.'; }
      else { s.done = true; s.note = ''; if (i < 3) fillGolden(); }
    }
    else if (act === 'reopen') { s.done = false; s.note = ''; }
    else if (act === 'fetch') { fillGolden(); var n = [0, 1, 2].filter(function (k) { return state.sets[k].done; }).length; s.note = n === 3 ? '' : 'Faltan finalizar ' + (3 - n) + ' grado(s) para completar los 3 lugares.'; s.done = false; }
    else if (act === 'reset') { confirmReset = true; }
    else if (act === 'reset-no') { confirmReset = false; }
    else if (act === 'reset-yes') { state = fresh(); confirmReset = false; }
    save(); render();
  });

  render();
})();
</script>

</body></html>
